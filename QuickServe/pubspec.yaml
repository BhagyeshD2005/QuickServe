name: quickserve
description: QuickServe customer service request management application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # NEW: address auto-detect (GPS -> readable address)
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # NEW: call customer / open Google Maps navigation
  url_launcher: ^6.3.0

  # NEW: push notifications (Firebase Cloud Messaging + on-device display)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true